name: release

# A version tag in the public repository builds the rpm and deb packages, the
# source tarball and SHA256SUMS, signs SHA256SUMS with the key kept in the
# repository secrets, checks the signature, and only then publishes the GitHub
# release (created as a draft until then).
# Run by hand (in the private repository where this file is maintained, before
# publishing) it only builds and checks an unsigned snapshot.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  SIGNING_FINGERPRINT: EE2D0814C5CE3F1F76CE4B2EB37604513E193961
  PUBLISH: ${{ github.repository == 'takeshiue/jevtri' && github.ref_type == 'tag' }}

jobs:
  # Packages that build but do not install must never be published: install,
  # run, rotate, upgrade and remove them in every supported distribution first.
  install:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: alma8-amd64, kind: rpm, image: almalinux/8-minimal, runner: ubuntu-latest, arch: amd64, package_arch: x86_64}
          - {name: alma9-amd64, kind: rpm, image: almalinux/9-minimal, runner: ubuntu-latest, arch: amd64, package_arch: x86_64}
          - {name: alma10-amd64, kind: rpm, image: almalinux/10-minimal, runner: ubuntu-latest, arch: amd64, package_arch: x86_64}
          - {name: ubuntu2204-amd64, kind: deb, image: ubuntu:22.04, runner: ubuntu-latest, arch: amd64, package_arch: amd64}
          - {name: ubuntu2404-amd64, kind: deb, image: ubuntu:24.04, runner: ubuntu-latest, arch: amd64, package_arch: amd64}
          - {name: debian12-amd64, kind: deb, image: debian:12, runner: ubuntu-latest, arch: amd64, package_arch: amd64}
          - {name: alma8-arm64, kind: rpm, image: almalinux/8-minimal, runner: ubuntu-24.04-arm, arch: arm64, package_arch: aarch64}
          - {name: alma9-arm64, kind: rpm, image: almalinux/9-minimal, runner: ubuntu-24.04-arm, arch: arm64, package_arch: aarch64}
          - {name: alma10-arm64, kind: rpm, image: almalinux/10-minimal, runner: ubuntu-24.04-arm, arch: arm64, package_arch: aarch64}
          - {name: ubuntu2204-arm64, kind: deb, image: ubuntu:22.04, runner: ubuntu-24.04-arm, arch: arm64, package_arch: arm64}
          - {name: ubuntu2404-arm64, kind: deb, image: ubuntu:24.04, runner: ubuntu-24.04-arm, arch: arm64, package_arch: arm64}
          - {name: debian12-arm64, kind: deb, image: debian:12, runner: ubuntu-24.04-arm, arch: arm64, package_arch: arm64}
    name: install (${{ matrix.name }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          version: v2.18.2
          install-only: true
      - name: Build two versions to test an upgrade
        run: |
          mkdir -p build pkg
          test "$(go env GOARCH)" = "${{ matrix.arch }}"
          git archive --format=tar.gz -o build/jevtri-source.tar.gz HEAD
          source_version=$(sed -n 's/^var version = "\(.*\)"$/\1/p' cmd/jevtri/main.go)
          test -n "$source_version"
          for version in 0.0.1 "$source_version"; do
            JEVTRI_SNAPSHOT_VERSION=$version goreleaser release --snapshot --clean --skip=publish,sign
            cp "dist/jevtri_${version}_${{ matrix.package_arch }}.${{ matrix.kind }}" pkg/
          done
          cp tests/distro/check.sh pkg/
      - name: Install, run, rotate, upgrade and remove
        run: |
          ext="${{ matrix.package_arch }}.${{ matrix.kind }}"
          source_version=$(sed -n 's/^var version = "\(.*\)"$/\1/p' cmd/jevtri/main.go)
          docker run --rm -v "$PWD/pkg:/pkg:ro" "${{ matrix.image }}" \
            sh /pkg/check.sh ${{ matrix.kind }} /pkg/jevtri_0.0.1_$ext /pkg/jevtri_${source_version}_$ext 0.0.1 "$source_version"
      - name: Prepare the private installation artifact
        if: ${{ success() && github.event.repository.private == true && matrix.name == 'ubuntu2404-amd64' }}
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(go env GOARCH)" = amd64
          source_version=$(sed -n 's/^var version = "\(.*\)"$/\1/p' cmd/jevtri/main.go)
          test -n "$source_version"
          package_name="jevtri_${source_version}_amd64.deb"
          test -s "pkg/$package_name"
          artifact_directory=build/private-install
          mkdir -p "$artifact_directory"
          cp "pkg/$package_name" "$artifact_directory/"
          python3 - "$artifact_directory/manifest.json" "$artifact_directory/$package_name" "$source_version" <<'PY'
          import hashlib
          import io
          import json
          import os
          import pathlib
          import subprocess
          import sys
          import tarfile
          package = pathlib.Path(sys.argv[2])
          payload = subprocess.check_output(["dpkg-deb", "--fsys-tarfile", str(package)])
          with tarfile.open(fileobj=io.BytesIO(payload), mode="r:") as archive:
              members = [entry for entry in archive.getmembers() if entry.name in ("./usr/bin/jevtri", "usr/bin/jevtri")]
              if len(members) != 1 or not members[0].isfile() or not 0 < members[0].size <= 64 << 20:
                  raise SystemExit("deb has no unique regular jevtri executable")
              with archive.extractfile(members[0]) as executable:
                  binary = executable.read()
          binary_path = pathlib.Path("build/private-jevtri")
          binary_path.write_bytes(binary)
          go_version = subprocess.check_output(["go", "env", "GOVERSION"], text=True).strip()
          buildinfo = subprocess.check_output(["go", "version", "-m", str(binary_path)], text=True)
          binary_go_version = buildinfo.splitlines()[0].rsplit(": ", 1)[-1]
          if binary_go_version != go_version:
              raise SystemExit("deb executable was built with a different Go version")
          manifest = {
              "repository": os.environ["GITHUB_REPOSITORY"],
              "source_commit": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "version": sys.argv[3],
              "go_version": go_version,
              "binary_go_version": binary_go_version,
              "architecture": "amd64",
              "installation_target": "ubuntu:24.04",
              "installation_check": "passed",
              "package": package.name,
              "deb_sha256": hashlib.sha256(package.read_bytes()).hexdigest(),
              "binary_sha256": hashlib.sha256(binary).hexdigest(),
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(manifest, indent=2) + "\n")
          PY
          cd "$artifact_directory"
          sha256sum "$package_name" manifest.json > SHA256SUMS
      - name: Store the private installation artifact
        if: ${{ success() && github.event.repository.private == true && matrix.name == 'ubuntu2404-amd64' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jevtri-install-candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: build/private-install/
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 7
          compression-level: 0

  release:
    needs: install
    runs-on: ubuntu-latest
    permissions:
      contents: write # creates and publishes the release
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: stable
      - name: Tag matches the version in the source
        if: github.ref_type == 'tag'
        run: |
          source_version=$(sed -n 's/^var version = "\(.*\)"$/\1/p' cmd/jevtri/main.go)
          if [ "v$source_version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $source_version in cmd/jevtri/main.go" >&2
            exit 1
          fi
          # The release notes are this version's section of CHANGELOG.md, which
          # must carry a date, not "unreleased".
          if ! grep -qE "^## $source_version - [0-9]{4}-[0-9]{2}-[0-9]{2}$" CHANGELOG.md; then
            echo "CHANGELOG.md has no dated section for $source_version" >&2
            exit 1
          fi
      - name: Check
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest
          test -z "$(gofmt -l .)"
          go vet ./...
          "$(go env GOPATH)/bin/staticcheck" ./...
          go test ./...
          TZ=UTC go test ./...
          CGO_ENABLED=1 go test -race -count=1 ./...
          "$(go env GOPATH)/bin/govulncheck" ./...
      - name: Source tarball
        run: |
          version=$(sed -n 's/^var version = "\(.*\)"$/\1/p' cmd/jevtri/main.go)
          mkdir -p build
          # The public repository has no .gitignore; without this GoReleaser
          # sees build/ as a dirty tree and refuses to release.
          echo /build/ >> .git/info/exclude
          git archive --format=tar.gz --prefix="jevtri-$version/" -o "build/jevtri-$version.tar.gz" HEAD
          awk -v v="$version" '/^## /{p=($2==v); next} p' CHANGELOG.md > build/notes.md
      - name: Import the signing key
        if: env.PUBLISH == 'true'
        run: printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
      # Pinned to the commit of v7.2.3.
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94
        with:
          version: v2.18.2
          args: ${{ env.PUBLISH == 'true' && 'release --clean --release-notes build/notes.md' || 'release --snapshot --clean --skip=publish,sign' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_FINGERPRINT: ${{ env.SIGNING_FINGERPRINT }}
      - name: Check the packages and the signature
        run: |
          cd dist
          ls -l ./*.rpm ./*.deb
          # SHA256SUMS also covers the source tarball, which is built in build/.
          cp ../build/jevtri-*.tar.gz .
          sha256sum -c SHA256SUMS
          if [ "$PUBLISH" = true ]; then
            # Any valid signature is not enough: it must be the published key.
            signer=$(gpg --status-fd 1 --verify SHA256SUMS.asc SHA256SUMS 2>/dev/null | awk '$2=="VALIDSIG"{print $3}')
            test "$signer" = "$SIGNING_FINGERPRINT"
          fi
      - name: Publish the release
        if: env.PUBLISH == 'true'
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
